[package]
name = "attimo-agent"
version = "0.3.4"
description = "Attimo Agent Terrain — Upload live terrain pour photographes sportifs"
authors = ["Frédéric Gras"]
edition = "2021"

[lib]
name = "attimo_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri core ---
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"

# --- Sérialisation ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- HTTP (appels API Attimo) ---
reqwest = { version = "0.12", features = ["multipart", "json", "native-tls", "stream"] }

# --- Async runtime ---
tokio = { version = "1", features = ["full"] }

# --- Base de données locale ---
rusqlite = { version = "0.31", features = ["bundled"] }

# --- Watch folder (événements filesystem natifs) ---
notify = "6"

# --- Utilitaires ---
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"

# --- Traitement image (compression JPEG optionnelle) ---
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# --- Espace disque (SAAS 430) ---
# Lecture multiplateforme de l'espace libre, sans `unsafe` côté agent.
fs4 = "1"

# --- Flux d'envoi des photos (0.3.2) ---
# Le fichier part en flux, morceau par morceau : l'agent sait ainsi quand le
# dernier octet a quitté le poste, et sépare l'envoi du traitement serveur.
futures-util = { version = "0.3", default-features = false }

# --- Stockage sécurisé du jeton (0.3.2) ---
# Windows : DPAPI, le coffre de la session utilisateur. Le jeton n'est plus
# lisible en clair dans auth.json.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

# macOS : le trousseau (Keychain).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
